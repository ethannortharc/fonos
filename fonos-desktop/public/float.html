<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:transparent;overflow:visible;-webkit-user-select:none;user-select:none;width:100%;height:100%;
    -webkit-clip-path:inset(0 round 0);clip-path:inset(0 round 0)}
  body{background:transparent;overflow:visible;width:100%;height:100%}

  /* Hidden until the shape is known (float_geometry resolves and applyForm adds
     .form-ready). Without this the first frame paints the pill's glyph and
     wordmark inside whatever window size the configured shape asked for —
     e.g. a 98px pill clipped into a 44px hairline window. `visibility` rather
     than `opacity` so it cannot collide with the resting/hover/dormant opacity
     rules on #pill. */
  #container{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    visibility:hidden}
  html.form-ready #container{visibility:visible}

  /* ── Dropdown ── */
  #dropdown{
    display:none;flex-direction:column;
    background:rgba(22,21,18,0.95);
    backdrop-filter:blur(30px) saturate(115%);-webkit-backdrop-filter:blur(30px) saturate(115%);
    border:1px solid rgba(255,255,255,0.1);border-radius:16px;
    /* Inset highlight only — NO outer drop shadow. The window hugs the content
       (a few px of margin), so any outer blur is clipped by the window edge
       into a visible faint dark RECTANGLE behind the glass shape. */
    box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
    padding:7px;margin-bottom:9px;
    width:156px;
  }
  #dropdown.show{display:flex}

  /* ── iOS-style drum roller ── */
  .roller{
    position:relative;height:102px;overflow:hidden;
  }
  .roller.single{height:38px}
  .roller.double{height:68px}
  .roller.single::before,.roller.single::after,.roller.double::before,.roller.double::after{display:none}
  /* Center highlight band */
  .roller::after{
    content:'';position:absolute;left:6px;right:6px;
    top:50%;transform:translateY(-50%);
    height:32px;border-radius:8px;
    background:rgba(245,158,11,0.1);
    border:1px solid rgba(245,158,11,0.15);
    pointer-events:none;z-index:0;
  }
  /* Fade top and bottom */
  .roller::before{
    content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(
      rgba(26,25,23,0.96) 0%,
      transparent 30%,
      transparent 70%,
      rgba(26,25,23,0.96) 100%
    );
  }

  .roller-track{
    position:absolute;left:0;right:0;
    transition:transform 0.2s cubic-bezier(0.22,1,0.36,1);
    will-change:transform;
  }
  .roller-item{
    display:flex;align-items:center;gap:8px;
    height:34px;padding:0 12px;border-radius:9px;
    font-family:-apple-system,'SF Pro Text',sans-serif;
    cursor:pointer;position:relative;z-index:1;
    transition:opacity 0.15s;
  }
  .roller-item .m-icon{font-size:14px;line-height:1;flex-shrink:0;color:rgba(255,255,255,0.42)}
  .roller-item .m-name{font-size:12px;font-weight:500;color:rgba(255,255,255,0.45)}
  .roller-item.center .m-icon{color:rgba(251,191,36,0.95)}
  .roller-item.center .m-name{color:rgba(251,191,36,0.95);font-weight:600}
  .roller.single .roller-item.center,.roller.double .roller-item.center{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.14)}

  .dd-sep{height:1px;background:rgba(255,255,255,0.04);margin:5px 6px}
  .dd-btn{
    display:flex;align-items:center;gap:7px;
    padding:7px 10px;border-radius:9px;cursor:pointer;
    font-size:12px;color:rgba(255,255,255,0.48);transition:background .16s,color .16s;
    font-family:-apple-system,sans-serif;font-weight:500;
  }
  .dd-btn:hover{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.7)}
  .dd-btn .s-icon{font-size:14px;line-height:1}

  /* ── Pill ── */
  #pill{
    display:inline-flex;align-items:center;justify-content:center;
    font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;
    /* Scoped transition (was `all`): the only properties that ever change
       between states/hover are background, border-color and opacity, so the
       aesthetic is identical — but `all` would also animate any future
       geometry property (width/padding/…) against the INSTANT native window
       resize, handing the compositor mid-flight frames where the pill is
       wider than the already-resized window. Geometry changes must be atomic
       with respect to resize_float; only paint-only properties may tween. */
    transition:background 0.3s ease,border-color 0.3s ease,opacity 0.3s ease;
    cursor:pointer;
    opacity:0.55;
  }

  /* ── Glass chrome ──
     Worn by the `pill` idle shape and by EVERY working state, whatever the
     idle shape is. It is a separate class rather than part of #pill because
     the minimal shapes (hairline, dot) exist precisely to put NO
     backdrop-filter over your text — a blur you can barely see still smears
     what is under it, which is strictly worse than one you can. So the blur
     has to be opt-in, not something the small shapes have to undo. */
  #pill.glass{
    height:30px;padding:0 11px;
    background:rgba(22,21,18,0.9);
    backdrop-filter:blur(22px) saturate(112%);-webkit-backdrop-filter:blur(22px) saturate(112%);
    border:1px solid rgba(255,255,255,0.1);border-radius:999px;
    /* Inset highlight only — no outer drop shadow (see #dropdown note). */
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  }
  /* Idle only. Without the :not(.working) guard this rule — id + class +
     pseudo-class — outranks #pill.recording / .processing / .success / .error,
     so hovering mid-recording would repaint the red-bordered recording chrome
     as the neutral idle hover. */
  #pill.glass:not(.working):hover{background:rgba(24,23,20,0.96);border-color:rgba(255,255,255,0.16)}
  #pill:hover{opacity:1}
  #pill.recording{opacity:1}

  #idle{display:flex;align-items:center;justify-content:center;gap:6px}
  #idle-mark{width:15px;height:15px;color:rgba(251,191,36,.88);display:flex;align-items:center;justify-content:center;transition:color 0.15s}
  #idle-mark svg{display:block}
  #pill-text{font-size:10px;font-weight:750;color:rgba(251,191,36,0.78);letter-spacing:0.7px;transition:color 0.15s;line-height:1}
  #pill:hover #pill-text{color:rgba(251,191,36,0.98)}
  #pill:hover #idle-mark{color:rgba(251,191,36,1)}

  /* ── Idle shapes ──
     Only the idle pane varies; the working states always render the full pill.
     The shape class lives on <html> so it can also size #pill, which carries
     the state classes. Shape geometry (the window size each one implies) is
     owned by Rust's float_geom and applied from JS — the only numbers here are
     the ones that are purely about paint. */
  #hairline{display:none;width:44px;height:3px;border-radius:1.5px;background:rgba(251,191,36,0.85);transition:background 0.15s}
  #pill:hover #hairline{background:rgba(251,191,36,1)}
  html.form-hairline #idle-mark,html.form-hairline #pill-text{display:none}
  html.form-hairline #hairline{display:block}
  html.form-dot #pill-text{display:none}
  html.form-dot #idle-mark{width:14px;height:14px}
  html.form-dot #idle-mark svg{width:14px;height:14px}

  /* ── Dormant ──
     The resting state after `float_idle_fade_secs` of quiet. Dropping
     backdrop-filter is the whole point, not an optimization: at 18% opacity
     the glass is invisible, but a live blur would go on smearing the text
     underneath with nothing on screen to attribute the smear to.

     `#pill.dormant.glass` outranks `#pill.glass` on specificity (two classes
     to one), so the blur removal does not depend on source order. The bare
     `#pill.dormant` opacity DOES tie with `#pill:hover` — hence the explicit
     `#pill.dormant:hover` below, rather than relying on which came first. */
  #pill.dormant{opacity:0.18}
  #pill.dormant.glass{
    backdrop-filter:none;-webkit-backdrop-filter:none;
    background:rgba(22,21,18,0.5);
  }
  /* Pointer over it — wake instantly, without waiting for the JS timer reset. */
  #pill.dormant:hover{opacity:1}

  /* ── Growing ──
     Set while the window is catching up to a larger state. The content is
     already painted (state changes are synchronous — see applyVisual), so
     without this it would be visibly clipped by the still-small window for the
     two or three frames the native resize takes. `visibility` rather than
     `display` so layout — and therefore the menu height measurement — is
     unaffected, and rather than `opacity` so it cannot collide with the
     resting/hover/dormant opacity rules. */
  /* Covers the dropdown as well as the pill: the dropdown is a sibling inside
     #container, and a menu open is a GROW, so without this it paints at full
     height inside the still-small window and spills outside the native
     viewport for the frames the resize takes. On <html> rather than the
     elements themselves so it matches `html.form-ready #container`'s
     specificity and wins on source order. */
  html.sizing #container{visibility:hidden}

  /* ── Recording ── */
  #rec{display:none;align-items:center;gap:5px}
  #rec-dot{width:6px;height:6px;border-radius:50%;background:#ff453a;animation:pulse 1s ease-in-out infinite;flex-shrink:0}
  #rec-wave{width:40px;height:14px}
  #rec-dur{font-size:10px;color:rgba(255,255,255,0.52);font-family:'SF Mono',monospace;letter-spacing:0.3px}

  #pill.recording{background:rgba(22,21,18,0.92);border-color:rgba(255,69,58,0.12);cursor:default}
  #pill.recording #idle{display:none!important}
  #pill.recording #rec{display:flex}

  /* ── Processing ── */
  #proc{display:none;align-items:center;gap:5px}
  #proc-dots{display:flex;gap:3px}
  .pd{width:4px;height:4px;border-radius:50%;background:#fbbf24;animation:pulse 1.2s ease-in-out infinite}
  #proc-label{font-size:10px;color:rgba(251,191,36,0.72);font-family:-apple-system,sans-serif}

  #pill.processing{background:rgba(22,21,18,0.92);border-color:rgba(251,191,36,0.08);cursor:default;opacity:1}
  #pill.processing #idle{display:none!important}
  #pill.processing #proc{display:flex}

  /* ── Result (success / error) ── */
  #result{display:none;align-items:center;gap:4px}
  #result-icon{font-size:10px;line-height:1;display:flex;align-items:center}
  #result-text{font-size:10px;font-family:-apple-system,sans-serif;white-space:nowrap}
  /* Inline SVG glyphs render as blocks so they center cleanly with no
     baseline descender gap in the tiny result pane / menu button. */
  #result-icon svg,.s-icon svg,.m-icon svg{display:block}

  #pill.success{background:rgba(22,21,18,0.92);border-color:rgba(134,239,172,0.12);cursor:default;opacity:1}
  #pill.success #idle{display:none!important}
  #pill.success #result{display:flex}
  #pill.success #result-icon{color:#86efac}
  #pill.success #result-text{color:rgba(134,239,172,0.6)}

  #pill.error{background:rgba(22,21,18,0.92);border-color:rgba(239,68,68,0.12);cursor:default;opacity:1}
  #pill.error #idle{display:none!important}
  #pill.error #result{display:flex}
  #pill.error #result-icon{color:#ef4444}
  #pill.error #result-text{color:rgba(239,68,68,0.6)}

  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

  /* ── Pane entrance (Bug B) ── Non-mic workflows jump idle→processing→done
     with back-to-back native resizes on a transparent window; the done pane
     has no animation, so the compositor goes quiet and stale pixels linger
     until a hover forces a repaint. A one-shot entrance animation on each
     pane that becomes visible (display:none→flex restarts it) forces paint. */
  @keyframes paneIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
  #idle{animation:paneIn .2s ease}
  #pill.processing #proc{animation:paneIn .2s ease}
  #pill.success #result,#pill.error #result{animation:paneIn .2s ease}
  /* Reduced motion: opacity-only fade still forces a repaint, minimal motion. */
  @media (prefers-reduced-motion:reduce){
    @keyframes paneIn{from{opacity:0}to{opacity:1}}
  }

  /* ── Repaint guard ── Full-viewport, hit-test-invisible div flashed by
     flashRepaint() (see JS) to force WebKit to damage the ENTIRE transparent
     surface after every transition, not just the changed pane's rect.
     Deliberately plain: no transform / will-change / opacity animation, so
     WebKit cannot promote it to its own compositing layer — the damage must
     land on the root layer that owns the stale pixels. */
  #repaint-guard{position:fixed;inset:0;background:transparent;pointer-events:none;z-index:99}
</style>
</head>
<body>
<div id="container">
  <div id="dropdown"></div>
  <div id="pill" onclick="onPillClick(event)">
    <div id="idle">
      <span id="hairline"></span>
      <span id="idle-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="7" cy="12" r="2.15" fill="currentColor" stroke="none"/><path d="M11.2 7.4a6.1 6.1 0 0 1 0 9.2"/><path d="M15 4.45a10 10 0 0 1 0 15.1"/></svg></span>
      <span id="pill-text">FONOS</span>
    </div>
    <div id="proc">
      <div id="proc-dots"><div class="pd"></div><div class="pd" style="animation-delay:.2s"></div><div class="pd" style="animation-delay:.4s"></div></div>
      <span id="proc-label">Processing</span>
    </div>
    <div id="result">
      <span id="result-icon"></span>
      <span id="result-text"></span>
    </div>
    <div id="rec">
      <div id="rec-dot"></div>
      <canvas id="rec-wave" width="40" height="14"></canvas>
      <span id="rec-dur">0s</span>
    </div>
  </div>
</div>
<div id="repaint-guard"></div>

<script>
/* ── SVG icon mapper (matches main app Icons.tsx) ── */
var SVG_ICONS={
  '📝':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  '✨':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"/></svg>',
  '🌐':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  '👔':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="2" y1="13" x2="22" y2="13"/></svg>',
  '📓':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  '🎙':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>',
  '🎙️':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>',
  '📌':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17z"/></svg>',
  '🎤':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>',
  '⚙':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  '🤖':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><line x1="9" y1="13" x2="9" y2="15"/><line x1="15" y1="13" x2="15" y2="15"/></svg>',
  '💡':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5.76.76 1.23 1.52 1.41 2.5"/></svg>',
  '🎧':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>',
  '🗓':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  '📞':'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
};
// Emoji-with-variation-selector forms map to the same glyphs.
SVG_ICONS['🗓️']=SVG_ICONS['🗓'];
SVG_ICONS['⚙️']=SVG_ICONS['⚙'];
function setModeIcon(el,emoji){
  /* No emoji ever renders in the pill menu: unknown icons (custom recipes
     with a user-picked emoji) fall back to the gear glyph so the roller
     stays in the app's stroke-SVG language. */
  var svg=SVG_ICONS[emoji]||SVG_ICONS['⚙'];
  /* SVG strings are hardcoded above — safe static content */
  var tpl=document.createElement('template');tpl.innerHTML=svg;
  el.appendChild(tpl.content);
}

/* ── Pill-chrome glyphs (same stroke-based, currentColor icon language as the
   app's WidgetIcon/Icons; each host element's CSS supplies the color: green
   for success ✓, red for error ✗, muted white for the menu gear). check/cross
   use a slightly heavier stroke so the bare marks stay legible in the ~11px
   result pane. */
var CHROME_SVG={
  check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',

function setIconSvg(el,svg){
  el.textContent='';
  /* SVG strings are hardcoded above — safe static content */
  var tpl=document.createElement('template');tpl.innerHTML=svg;
  el.appendChild(tpl.content);
}

/* ── Tiny inline i18n ── The pill has a handful of static strings; the main app
   owns the full dictionary (lib/i18n). Locale follows config.ui_language
   ("auto"/"en"/"zh"), resolved the same way (auto → system language). Legacy
   roller mode names are intentionally NOT localized — that menu is slated for
   removal in P3. */
const STR={
  en:{proc:'Processing',done:'Done',nospeech:'No speech',emptyInput:'No text selected',error:'Error',clickSettings:' — click to open Settings',settings:'Settings'},
  zh:{proc:'处理中',done:'完成',nospeech:'未识别到语音',emptyInput:'未选中文本',error:'错误',clickSettings:' — 点按打开设置',settings:'设置'},
};
let LOCALE='en';
function L(k){return (STR[LOCALE]&&STR[LOCALE][k])||STR.en[k]||k;}
// Mirrors lib/i18n.resolveLocale: explicit "en"/"zh" win, "auto"/undefined
// follows navigator.language.
function resolveLocale(setting){
  if(setting==='en'||setting==='zh')return setting;
  return (navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en';
}
// Set the active locale and re-render any currently-visible static label so a
// live language switch (config:saved) takes effect without waiting for the
// next state change. Exposed on window (classic script) for tests to drive.
function applyLocale(setting){
  LOCALE=resolveLocale(setting);
  renderStaticLabels();
}
// Last transient result label key ('done'|'nospeech') so a live locale switch
// during the ~1.2s result window re-localizes it; null for idle / dynamic
// backend error text (which is not localized).
let lastResultKey=null;
function renderStaticLabels(){
  var pl=document.getElementById('proc-label');if(pl)pl.textContent=L('proc');
  if(lastResultKey){var rt=document.getElementById('result-text');if(rt)rt.textContent=L(lastResultKey);}
  // Settings caption only exists while the menu is open (rebuilt on each open).
  var cap=document.querySelector('#dropdown .dd-btn .dd-cap');
  if(cap)cap.textContent=L('settings');
}

// Fallback voice workflows shown before list_workflows resolves (or if it
// fails). The live list comes from list_workflows filtered to microphone
// sources; the main dictation hotkey triggers whichever one is selected.
const BUILTIN_MODES=[
  {id:'wf.dictation',icon:'🎤',name:'Dictation'},
];
let allModes=[...BUILTIN_MODES];
let currentMode='wf.dictation',isRec=false,animId=null,animT=0,durTm=null;
let rollerIdx=0; // index into circular list, maps to center slot
// Error state: while an error is showing, clicking the pill opens the
// permission's System Settings pane (if any) instead of the mode menu.
let errActive=false,errPane=null,errTimer=null,stopTm=null;

/* ── Geometry ──
   Sizes are LOGICAL pixels throughout, and the idle sizes are owned by Rust
   (commands::float_geom) rather than restated here — that lockstep between
   tauri.conf.json, this file and the placement math used to be maintained by
   hand, and nothing caught it when it slipped.

   Nothing converts to physical pixels on this side any more. It used to, via a
   `devicePixelRatio` captured once at load; now that the indicator can be
   dragged between displays that value goes stale the moment it crosses onto a
   monitor with a different scale factor, and every later resize would be off
   by the ratio between them. resize_float converts against the window's live
   scale instead.

   The values below are the pill defaults, used until float_geometry
   resolves (and if it fails) so the pill always has a sane size to render at. */
let FORM='pill';
let IDLE_FADE=8;                 // seconds of quiet before dimming; 0 = never
let IDLE_SIZES={hairline:[44,14],dot:[24,24],pill:[98,32],off:[98,32]};
let PH=32;                       // working-state pill height
const REC_W=122,PROC_W=116,MENU_W=168;
/// Narrowest a working-state pill may be — the pre-0.8.7 idle width. The idle
/// shape's own width is irrelevant here: a 44px hairline still expands to a
/// readable pill the moment it has something to report.
const RESULT_MIN_W=98;

function idleW(){return (IDLE_SIZES[FORM]||IDLE_SIZES.pill)[0];}
function idleH(){return (IDLE_SIZES[FORM]||IDLE_SIZES.pill)[1];}

// Width for a success/no-speech result pill. English/short labels stay at the
// 98px floor; a longer localized label — e.g. the zh "未识别到语音" — grows the
// pill just enough that it never clips. CJK glyphs are ~full-em at the 9px
// result font, latin ~5px; +icon(12)+gap(4)+pad(20)+slack.
function resultW(label){
  var t=0;
  for(var i=0;i<label.length;i++)t+=label.charCodeAt(i)>0x2e7f?9.5:5;
  return Math.max(RESULT_MIN_W,Math.round(t+42));
}

/* Paint the chrome and sizing that belong to the *current* combination of idle
   shape and state. Called from inside every applyVisual mutation, so it lands
   in the same frame as the state change it belongs to.

   A working state (recording/processing/result) always renders the
   full glass pill, whatever the idle shape, because that is exactly when you
   want to see it. At idle only the `pill` shape wears chrome; hairline and dot
   are bare marks, and get an explicit height so they sit centered in their
   window instead of collapsing against its bottom edge (#container is
   bottom-aligned so the menu can grow upward). */
function applyChrome(){
  setFormClass();
  var p=document.getElementById('pill');
  var working=expectedState!==null;
  var glass=working||FORM==='pill';
  p.classList.toggle('glass',glass);
  // Marks the working states for CSS that must not treat them as idle (the
  // hover chrome above). The state classes themselves can't serve: a selector
  // would have to name all four, and miss the next one added.
  p.classList.toggle('working',working);
  // #pill is inline-flex, so it hugs its content — a 14pt dot inside a 24pt
  // window, or a content-sized glass pill inside the 122pt recording window,
  // leaves strips that the window swallows clicks on but #pill (which carries
  // the click and drag handlers) never receives. Pin it to the full window
  // width so the window really is the hit area, which is the entire premise of
  // the sizing. The exception is an open menu: there the window is as wide as
  // the dropdown and the pill is only its bottom row, so stretching it would
  // draw a 168pt-wide pill under a 156pt menu.
  var menuOpen=document.getElementById('dropdown').classList.contains('show');
  var fill=!menuOpen&&desiredW&&desiredH;
  p.style.width=fill?desiredW+'px':'';
  p.style.height=fill?desiredH+'px':(glass?'':idleH()+'px');
}

// Dev-only assertions: the vite dev server / a plain browser load via
// http(s):, the packaged app via tauri:. Keeps assert noise out of prod logs.
const DEV=location.protocol==='http:'||location.protocol==='https:';

/* `curW`/`curH` hold the size RUST last reported the window to be — never a
   size this file merely requested. See applyVisual's "who owns the window
   size" note: an issued resize cannot be recalled, so tracking our own
   requests would drift from reality the first time a transition is superseded.
   NaN after a failure, so every later comparison misses and the next
   transition re-issues its resize. */
let curW=0,curH=0;
function sz(w,h,anchorOffsetY){
  // Only the reconciler may call this: every native resize must ride the
  // protected paint/resize ordering.
  if(typeof window.__TAURI_INTERNALS__==='undefined'){curW=w;curH=h;return Promise.resolve();}
  return window.__TAURI_INTERNALS__.invoke('resize_float',{
    width:w,height:h,
    // How far below the window's top edge the mark sits. Omitted (null) means
    // centered, which is right for every state except an open menu — that
    // grows the window upward, leaving the mark near the bottom, and centering
    // there would shove it down by half the menu's height as it opened.
    anchorOffsetY:(typeof anchorOffsetY==='number')?anchorOffsetY:null,
  }).then(function(){
    // Rust de-duplicates against its own record of what it last asked the
    // platform for, so a resolved call means the window is committed to this
    // size even though the frame change may still be queued.
    curW=w;curH=h;
  },function(e){
    // NaN misses every later comparison, so the next transition re-issues its
    // resize — and, unlike a numeric sentinel, cannot masquerade as a small
    // window and make a shrink look like a grow.
    curW=NaN;curH=NaN;
    throw e;
  });
}

/* ── Full-surface invalidation (structural fix for the ghost-layer bug) ──
   WKWebView repaints partial damage rects: a state swap whose animation only
   touches the small pane region re-rasterizes just that rect, so stale pixels
   elsewhere in the transparent surface (an old pill outline at a different
   width, the closed menu's glass) survive until something else — typically
   the hover transition — happens to damage them. flashRepaint toggles the
   full-viewport #repaint-guard's background between transparent and a 1%-alpha
   wash: both edges of the flash mark the whole viewport dirty in the root
   layer, and the resulting layer-tree commit + composite also re-evaluates the
   pill/menu backdrop-filter layers, flushing any stale one. The OFF edge is
   the one that matters — it lands two frames after the LAST transition and
   repaints the full surface at the settled final state (overlapping flashes
   coalesce via `flashTok`). Chosen over alternatives: toggling a transform on
   <html> churns compositor layer creation (its own flicker risk), and a
   second native resize re-enters the exact resize path being fixed. The guard
   is pointer-events:none, so clicks and elementFromPoint pass through.

   The flash fixes stale pixels INSIDE the webview. The stale layer can also
   live BELOW it: the window server may keep compositing the transparent
   NSWindow's previous backing store + shadow (two superimposed pill frames,
   e.g. 110px processing over 90px idle) until the window gets a display pass
   — which is why a click used to repair it. So after the OFF-edge repaint has
   had a frame to commit, ask the native side to invalidateShadow + force a
   display pass on the NSWindow (refresh_float_window, fire-and-forget).
   `flashTok` already coalesces bursts — only the last transition's flash
   reaches its OFF edge, so at most one native call per settled burst. */
let flashTok=0;
function flashRepaint(){
  const g=document.getElementById('repaint-guard');
  if(!g)return;
  const tok=++flashTok;
  g.style.background='rgba(127,127,127,0.01)';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(tok!==flashTok)return;
    g.style.background='transparent';
    // One more frame so the OFF-edge full-surface repaint (settled final
    // state) has been committed, THEN drop the window server's composite —
    // invalidating before the settled paint would recompute the shadow from
    // the old content. Same-size transitions skip resize_float entirely, so
    // this is their ONLY native invalidation; resizing ones get it twice
    // (frame-change time + here), both imperceptible.
    requestAnimationFrame(()=>{
      if(tok!==flashTok)return;
      if(typeof window.__TAURI_INTERNALS__==='undefined')return;
      window.__TAURI_INTERNALS__.invoke('refresh_float_window').catch(()=>{});
    });
  }));
}

// Dev-only single-state invariant check: after every transition the pill must
// carry exactly the state class enterState last set — one of the four for
// active states, none for idle. More than one means panes are stacking again.
let expectedState=null; // maintained by enterState
function assertState(){
  if(!DEV)return;
  const p=document.getElementById('pill');
  const have=['recording','processing','success','error'].filter(c=>p.classList.contains(c));
  console.assert(have.length<=1&&(have[0]||null)===expectedState,
    '[float] state invariant violated: expected '+(expectedState||'idle')+', got ['+have.join(',')+']');
}

/* ── Single protected transition path ──
   EVERY visual transition (state change, menu open/close, revert timers,
   startup sizing) goes through applyVisual so the paint/resize ordering is
   encoded once, not per call site:
   - GROW: resize the native window FIRST (awaiting sz(), i.e. the frame
     change is applied), then paint the new content — painting wider content
     into the still-small window would clip it and hand the compositor a
     mid-transition frame.
   - SHRINK: paint the new (smaller) content first, wait two rAFs so a frame
     containing it has actually been committed, then shrink the window —
     shrinking first would clip the still-wide old content.
   - SAME SIZE: no native call at all (and Rust-side resize_float also skips
     no-op geometry as a second line of defense).
   Every path ends in flashRepaint() so the whole surface is re-rasterized at
   the final state. `seq` supersedes queued work when a newer transition
   begins (rapid hotkey sequences): the newest transition always wins and no
   stale resize can land after it. */
function twoFrames(fn){requestAnimationFrame(()=>requestAnimationFrame(fn));}
/* Two frames, or 50ms — whichever comes first.

   The timer is not belt-and-braces, it is load-bearing: WebKit suspends
   requestAnimationFrame for a window that is hidden or fully occluded, and the
   reconciler awaits this BEFORE the window is first shown. Without the timer
   that is a closed loop — no frames until the window is shown, and the window
   is not shown until the geometry lands, which waits on frames. The indicator
   never appeared at all.

   50ms is ~3 frames at 60Hz, so on a visible window rAF always wins and the
   timer never fires. */
function nextTwoFrames(){
  return new Promise(function(resolve){
    var done=false;
    var fin=function(){if(done)return;done=true;resolve();};
    twoFrames(fin);
    setTimeout(fin,50);
  });
}

/* ── State and geometry are separate concerns ──

   The state mutation runs SYNCHRONOUSLY and unconditionally. It is never
   deferred behind a resize and never cancelled, because a state change is not a
   request — it already happened. The pipeline said "recording started"; the
   only question is what the window looks like, not whether we believe it.

   Every bug in this area came from the previous design, which awaited the
   resize and only then applied the mutation: anything that superseded the
   resize also silently discarded the state change. A settings save landing in
   the ~3 frames of a recording's grow left the pill idle for the whole take,
   and a failed grow into a terminal error left it stuck on the previous pane
   forever. Bookkeeping added to detect those cases (a `pendingState` marker, a
   supersession token) then had its own stranding bugs.

   Geometry is reconciled toward `desired*` by a single coalescing loop. It is
   idempotent and always converges on the newest desired size, so there is
   nothing to supersede and no ordering to get wrong. */
let desiredW=0,desiredH=0,desiredOff=null;

/* Paint ordering is preserved as a paint-only concern. On a GROW the window is
   still small when the wider content is painted, so the pane is hidden (see
   `.sizing` in the CSS) until the window has caught up — a few frames of
   nothing, rather than a few frames of a clipped pill. On a SHRINK the smaller
   content is already correct inside the larger window, so nothing is hidden. */
function applyVisual(mutate,w,h,anchorOffsetY){
  // NaN (a failed resize) must count as "unknown, assume grow" — the safe side,
  // since growing hides the pane rather than risking a clipped paint.
  const grows=!(w<=curW&&h<=curH);
  if(grows)document.documentElement.classList.add('sizing');
  // Before the mutation, not after: applyChrome() sizes #pill from these, and
  // reading them a line too late left the pill wearing the PREVIOUS state's
  // width — a 44pt pill inside a 122pt recording window, with transparent
  // strips either side that swallow clicks without being clickable.
  desiredW=w;desiredH=h;desiredOff=anchorOffsetY;
  mutate();
  assertState();
  applyChrome();
  armDormancy();
  // Hiding is immediate — an "off" indicator returning to idle should vanish
  // rather than linger at idle size for the length of a resize. Showing waits
  // for the geometry to land (below), so it is never revealed mis-sized.
  if(!shouldShow())syncVisibility();
  const settled=reconcile();
  if(shouldShow())settled.then(syncVisibility,NOOP);
  return settled;
}

/* Whether the window belongs on screen right now.

   `off` means "no idle presence", NOT "no feedback": pressing a hotkey and
   watching text appear with nothing acknowledging it anywhere on screen is
   disorienting. So the pill still surfaces for recording / processing / result
   and disappears again on the way back to idle. */
function shouldShow(){return FORM!=='off'||expectedState!==null;}
/* Deliberately uncached. A remembered "is it shown" would be a second opinion
   about a window this file does not own — Rust also shows it (the wedged-webview
   safety net at startup), and a cache that disagreed would suppress the very
   call needed to put things right. show/hide on an already-shown/hidden window
   is a no-op, and this runs a handful of times per dictation, not per frame. */
function syncVisibility(){invoke(shouldShow()?'show_float':'hide_float');}

/* Drive the window toward `desired*`. Coalescing: a call while one is running
   simply returns the running promise, because the loop re-reads `desired*` on
   every pass and will pick up the newer target on its own. */
/** Swallow a rejected transition. A resize failure is reported by whoever
    gates on the geometry (the reveal handshake); the many call sites that
    merely fire-and-forget must not turn it into an unhandled rejection. */
function NOOP(){}
let reconciling=null;
function reconcile(){
  if(reconciling)return reconciling;
  const run=(async function(){
    let failed=null;
    try{
      // Runs for every shape including "off". A hidden window still needs the
      // right geometry before it is revealed for a working state — and
      // resizing while hidden is the one moment nothing can flash.
      while(!(desiredW===curW&&desiredH===curH)){
        const w=desiredW,h=desiredH,off=desiredOff;
        const grows=!(w<=curW&&h<=curH);
        try{
          if(grows){
            // Resize first, then let the queued frame change actually run
            // before revealing the pane. `resize_float` resolving is NOT proof
            // the frame changed: tao dispatches both setters onto the main
            // queue, so the change lands when the main thread next reaches its
            // run loop — after the promise has already settled.
            await sz(w,h,off);
            await nextTwoFrames();
          }else{
            // The smaller content is already painted and fits, so shrink
            // whenever the compositor is ready for it.
            await nextTwoFrames();
            // Re-read before committing: a state can begin during those two
            // frames (closing the menu then immediately recording), and issuing
            // the shrink we captured beforehand would squeeze the window down
            // to idle before growing it again — the new pane visibly vanishing
            // in between. The loop condition picks up the newer target instead.
            if(desiredW!==w||desiredH!==h||desiredOff!==off)continue;
            await sz(w,h,off);
          }
        }catch(e){
          failed=e;
          // Retry only for a target that has since CHANGED — a newer state
          // deserves its own attempt. Retrying the same failing size would
          // spin on IPC forever, because the failure leaves curW/curH NaN and
          // NaN never equals the target.
          if(desiredW===w&&desiredH===h&&desiredOff===off)break;
          continue;
        }
        // This pass landed, so whatever failed before it is history — the
        // window IS the size the caller is waiting for. Keeping the stale error
        // would make a reveal handshake treat successful geometry as failed and
        // fall through to the safety net.
        failed=null;
        flashRepaint();
      }
    }finally{
      document.documentElement.classList.remove('sizing');
    }
    // Surface the failure: callers that gate on the geometry having landed
    // (the off→visible handshake, startup's reveal) must not proceed as though
    // the window were the right size.
    if(failed)throw failed;
  })();
  reconciling=run;
  // Clear the slot only once the run has settled, and only if it is still
  // ours. Doing this inside the async body ran BEFORE this assignment for a
  // pass that needed no resize, so the fulfilled promise was written back over
  // the null and every later reconcile() returned it without doing anything —
  // leaving `.sizing` applied and the indicator invisible until a reload.
  const clear=()=>{if(reconciling===run)reconciling=null;};
  run.then(clear,clear);
  return run;
}

function idleSz(){return applyVisual(()=>{enterState(null);},idleW(),idleH());}
/* Re-apply the geometry the current state already asked for. Used when
   something outside the state machine invalidates the window — switching away
   from "off", where every resize was skipped and the native window is still
   whatever startup left it. */
function reassertGeometry(){
  if(!desiredW||!desiredH)return idleSz();
  curW=NaN;curH=NaN; // force the reconciler to re-issue rather than see a match
  return reconcile();
}

function onPillClick(e){
  // A drag (or a press that closed the menu) ends in a click event here.
  // Swallow it, or every reposition would also toggle the workflow menu.
  if(swallowClick){swallowClick=false;e.stopPropagation();return;}
  // While an error is showing, a click opens the relevant System Settings pane
  // (when the error carries one) instead of toggling the mode menu.
  if(errActive){
    e.stopPropagation();
    if(errPane&&typeof window.__TAURI_INTERNALS__!=='undefined'){
      window.__TAURI_INTERNALS__.invoke('open_settings_pane',{pane:errPane}).catch(()=>{});
    }
    return;
  }
  toggleMenu(e);
}
function toggleMenu(e){
  // Idle only. `isRec` alone was not enough: processing and the result panes
  // clear it, so the menu could open over them — and closing it always targets
  // the IDLE size, which would clip the working pane into a 44pt window (and,
  // for the result panes, leave `.show` set on a menu nothing ever closes).
  if(expectedState!==null)return;
  e.stopPropagation();
  const dd=document.getElementById('dropdown');
  if(dd.classList.contains('show')){closeMenu();}
  else{
    // Reload modes each time menu opens — picks up newly added modes
    loadModes().then(()=>{
      // Re-check the FULL idle condition, not just isRec: processing and the
      // result panes clear isRec, so a load that resolves after one of them
      // began would open a menu over the working pane and hand applyVisual a
      // menu-sized target that supersedes the pane's own.
      if(expectedState!==null)return;
      rollerIdx=allModes.findIndex(m=>m.id===currentMode);
      if(rollerIdx<0)rollerIdx=0;
      renderMenu();
      // Menu open is a GROW: lay the menu out invisibly (visibility:hidden
      // computes layout but paints nothing) so its height can be measured
      // BEFORE the resize, then let applyVisual grow the window first and
      // reveal the menu only once the frame change has been applied.
      dd.style.visibility='hidden';
      dd.classList.add('show');
      const h=dd.offsetHeight;
      // The mark holds still and the menu grows upward above it: the window is
      // the menu plus the mark's own row, and the anchor sits in the middle of
      // that bottom row rather than in the middle of the window.
      const markH=idleH(),total=markH+h+10;
      applyVisual(()=>{dd.style.visibility='';},MENU_W,total,total-markH/2).catch(NOOP);
    });
  }
}
function closeMenu(){
  // No-op when already closed: this is called defensively on every outside
  // click and on window blur, and must not churn the window geometry (or
  // clobber a wide error pill) when there is nothing to close.
  const dd=document.getElementById('dropdown');
  if(!dd.classList.contains('show'))return;
  // Back to whatever the CURRENT state wants. It is idle in practice (the menu
  // cannot open otherwise), but a state can begin while the menu is up — a
  // hotkey press does not go through the pill — and shrinking to the idle size
  // then would clip the pane that just appeared.
  if(expectedState!==null){
    applyVisual(()=>{dd.classList.remove('show');},desiredW,desiredH,desiredOff).catch(NOOP);
  }else{
    applyVisual(()=>{dd.classList.remove('show');},idleW(),idleH()).catch(NOOP);
  }
}

// Get mode at circular index
function modeAt(i){
  const n=allModes.length;
  return allModes[((i%n)+n)%n];
}

function renderMenu(){
  const dd=document.getElementById('dropdown');dd.textContent='';

  // Roller
  const roller=document.createElement('div');roller.className='roller';
  const track=document.createElement('div');track.className='roller-track';

  function renderTrack(){
    track.textContent='';
    roller.classList.remove('single','double');
    if(allModes.length<=2){
      roller.classList.add(allModes.length===1?'single':'double');
      allModes.forEach(m=>{
        const item=document.createElement('div');
        item.className='roller-item'+(m.id===currentMode?' center':'');
        const icon=document.createElement('span');icon.className='m-icon';setModeIcon(icon,m.icon);
        const name=document.createElement('span');name.className='m-name';name.textContent=m.name;
        item.appendChild(icon);item.appendChild(name);
        item.onclick=ev=>{
          ev.stopPropagation();currentMode=m.id;rollerIdx=allModes.indexOf(m);saveCfg();renderTrack();setTimeout(closeMenu,120);
        };
        track.appendChild(item);
      });
      track.style.transform='translateY(0px)';
      return;
    }
    // Show 3 items: prev, current, next (circular)
    for(let offset=-1;offset<=1;offset++){
      const m=modeAt(rollerIdx+offset);
      const item=document.createElement('div');
      item.className='roller-item'+(offset===0?' center':'');
      const icon=document.createElement('span');icon.className='m-icon';setModeIcon(icon,m.icon);
      const name=document.createElement('span');name.className='m-name';name.textContent=m.name;
      item.appendChild(icon);item.appendChild(name);
      item.onclick=ev=>{
        ev.stopPropagation();
        if(offset!==0){
          rollerIdx=((rollerIdx+offset)%allModes.length+allModes.length)%allModes.length;
          renderTrack();
        }
        currentMode=modeAt(rollerIdx).id;
        saveCfg();
        if(offset===0)setTimeout(closeMenu,150);
      };
      track.appendChild(item);
    }
    // Position track so center item is in the middle of the 102px roller
    // 3 items × 34px = 102px, center is item[1] spanning y=34..68, its center
    // at y=51 = roller center (102/2) → already centered naturally at translateY(0)
    track.style.transform='translateY(0px)';
  }
  renderTrack();

  // Scroll wheel — circular
  roller.addEventListener('wheel',ev=>{
    ev.preventDefault();
    if(ev.deltaY>0) rollerIdx=(rollerIdx+1)%allModes.length;
    else rollerIdx=(rollerIdx-1+allModes.length)%allModes.length;
    currentMode=modeAt(rollerIdx).id;
    saveCfg();
    renderTrack();
  },{passive:false});

  roller.appendChild(track);
  dd.appendChild(roller);

  // Separator + Settings
  const sep=document.createElement('div');sep.className='dd-sep';dd.appendChild(sep);
  const btn=document.createElement('div');btn.className='dd-btn';
  const bIcon=document.createElement('span');bIcon.className='s-icon';setIconSvg(bIcon,CHROME_SVG.gear);
  const bText=document.createElement('span');bText.className='dd-cap';bText.textContent=L('settings');
  btn.appendChild(bIcon);btn.appendChild(bText);
  btn.onclick=ev=>{ev.stopPropagation();closeMenu();openSettings();};
  dd.appendChild(btn);
}

function saveCfg(){
  if(typeof window.__TAURI_INTERNALS__==='undefined')return;
  window.__TAURI_INTERNALS__.invoke('save_config',{configJson:JSON.stringify({active_voice_workflow:currentMode})}).catch(()=>{});
}
function loadCfg(){
  if(typeof window.__TAURI_INTERNALS__==='undefined')return;
  window.__TAURI_INTERNALS__.invoke('get_config').then(c=>{
    if(c&&c.active_voice_workflow)currentMode=c.active_voice_workflow;
    if(c)applyLocale(c.ui_language);
  }).catch(()=>{});
}
function loadModes(){
  if(typeof window.__TAURI_INTERNALS__==='undefined')return Promise.resolve();
  // Pill-roller workflows only: filter list_workflows to rows carrying a
  // pill_slot trigger (the roller shows one entry per such workflow,
  // ordered by its slot's `order`) — not to a widget's source type_tag.
  return window.__TAURI_INTERNALS__.invoke('list_workflows').then(rows=>{
    if(Array.isArray(rows)){
      var pillOrder=function(w){
        var t=(w.triggers||[]).find(function(x){return x&&x.kind==='pill_slot';});
        return t&&typeof t.order==='number'?t.order:0;
      };
      var pill=rows.filter(function(w){
        return w&&Array.isArray(w.triggers)&&w.triggers.some(function(t){return t&&t.kind==='pill_slot';});
      });
      pill.sort(function(a,b){return pillOrder(a)-pillOrder(b);});
      if(pill.length>0){ allModes=pill.map(function(w){return {id:w.id,icon:w.icon||'⚙',name:w.name};}); }
    }
  }).catch(()=>{});
}
function openSettings(){
  if(typeof window.__TAURI_INTERNALS__==='undefined')return;
  window.__TAURI_INTERNALS__.invoke('plugin:event|emit',{event:'show-main-window',payload:'settings'}).catch(()=>{});
}

/* ── Layered dormancy ──
   After `float_idle_fade_secs` of quiet the indicator drops to 18% and sheds
   its backdrop-filter (see the .dormant CSS). Re-armed by every transition and
   by the pointer coming near, so it only ever fires on genuine idleness.

   Working states never dim: the whole point of the recording/processing panes
   is to be read, and a run longer than the fade delay would otherwise fade out
   mid-sentence. */
let dormantTm=null;
function armDormancy(){
  if(dormantTm){clearTimeout(dormantTm);dormantTm=null;}
  var p=document.getElementById('pill');
  if(!p)return;
  p.classList.remove('dormant');
  if(!IDLE_FADE||expectedState!==null||FORM==='off')return;
  dormantTm=setTimeout(function(){
    dormantTm=null;
    // Re-check: a state may have begun between arming and firing.
    if(expectedState!==null)return;
    p.classList.add('dormant');
    // The opacity tween is 0.3s; flush the full surface once it has settled,
    // for the same reason every other transition does (see flashRepaint) —
    // a partial damage rect can leave the old, brighter pixels behind.
    setTimeout(flashRepaint,400);
  },IDLE_FADE*1000);
}

/* ── Drag ──
   The window IS the hit area (see float_geom), so a press anywhere on the
   indicator is either a click or the start of a drag. They are told apart by
   distance, not time: under DRAG_SLOP the press stays a click, at or past it
   the drag begins and the click that follows is swallowed.

   The gesture is driven from here via pointer capture rather than handed to the
   platform's own window-drag loop (`startDragging`). That loop swallows the
   pointerup, so the webview could only ever *infer* when the drag ended — and
   every way of inferring it was wrong in a different way. A debounce on window
   moves fires during a mid-drag pause, and worse, window-move events cannot
   distinguish the user dragging from this app moving its own window (following
   the cursor to another display, or clamping a bigger state back on screen), so
   a programmatic move could be recorded as the user's chosen position.

   Owning the gesture makes both ends unambiguous: pointerdown starts it,
   pointerup finishes it and commits once. Deltas are screen-relative, so the
   window tracking the pointer does not feed back into them. */
const DRAG_SLOP=4;
let pressed=false,dragging=false,swallowClick=false;
let pressX=0,pressY=0,lastX=0,lastY=0;

function invoke(cmd,args){
  if(typeof window.__TAURI_INTERNALS__==='undefined')return Promise.resolve();
  return window.__TAURI_INTERNALS__.invoke(cmd,args||{}).catch(()=>{});
}

function onPointerDown(e){
  // Left button only; a right-click must not start a window drag.
  if(e.button!==0)return;
  pressed=true;dragging=false;
  pressX=lastX=e.screenX;pressY=lastY=e.screenY;
  // Capture so the moves keep arriving even as the window slides out from
  // under the pointer.
  try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}
}

function onPointerMove(e){
  armDormancy(); // pointer activity over the indicator counts as "awake"
  if(!pressed)return;
  if(!dragging){
    if(Math.abs(e.screenX-pressX)<DRAG_SLOP&&Math.abs(e.screenY-pressY)<DRAG_SLOP)return;
    // A press that turns into a drag while the menu is open just closes the
    // menu. Dragging out of an open menu would have to shrink the window
    // mid-gesture, and the click that ends the gesture must not reopen what it
    // just closed — hence swallowClick.
    if(document.getElementById('dropdown').classList.contains('show')){
      pressed=false;swallowClick=true;closeMenu();return;
    }
    dragging=true;swallowClick=true;
  }
  var dx=e.screenX-lastX,dy=e.screenY-lastY;
  lastX=e.screenX;lastY=e.screenY;
  if(dx||dy)invoke('nudge_float',{dx:dx,dy:dy});
}

function onPointerUp(e){
  try{e.currentTarget.releasePointerCapture(e.pointerId);}catch(_){}
  pressed=false;
  if(!dragging)return;
  dragging=false;
  // One config write for the whole gesture.
  invoke('commit_float_anchor');
}

// The gesture was taken away (the system claimed the pointer, the window lost
// it). Distinct from pointerup: no click follows, so `swallowClick` must be
// cleared here or the NEXT genuine click is eaten. The position reached so far
// is still committed — the indicator is visibly sitting there, and leaving disk
// disagreeing with the screen is worse than persisting an interrupted drag.
function onPointerCancel(e){
  try{e.currentTarget.releasePointerCapture(e.pointerId);}catch(_){}
  pressed=false;swallowClick=false;
  if(!dragging)return;
  dragging=false;
  invoke('commit_float_anchor');
}

/* ── Idle shape ──
   Applying a shape is paint-only. Rust owns only the window's VISIBILITY for
   a shape (commands::set_float_visible); the geometry stays on this side so it
   rides applyVisual's protected transition path, which is what keeps curW/curH
   honest and stops a shape change from clipping a recording already in
   flight. */
// Returns true when the shape actually changed, so the caller knows whether the
// window geometry needs re-asserting. `config:saved` fires for every settings
// edit and always carries these two fields, so without this every unrelated
// save would churn a resize + full-surface repaint on the pill.
function setFormClass(){
  var root=document.documentElement;
  if(!root.classList.contains('form-'+FORM)){
    root.classList.remove('form-hairline','form-dot','form-pill','form-off');
    root.classList.add('form-'+FORM);
  }
  // Reveal the indicator now that its shape is settled (see #container).
  root.classList.add('form-ready');
}
// Returns true when the shape or fade delay actually changed, so the caller
// knows whether the window geometry needs re-asserting. `config:saved` fires
// for every settings edit and always carries these two fields, so without this
// every unrelated save would churn a resize + full-surface repaint.
//
// Deliberately does NOT paint the new shape: hairline↔dot changes width and
// height in OPPOSITE directions, so painting the dot while the window is still
// 44×14 clips it vertically. The class swap is handed to applyVisual as the
// mutation instead, where it lands on the correct side of the resize.
function applyForm(form,fadeSecs){
  var changed=false;
  if(form&&form!==FORM){FORM=form;changed=true;}
  if(typeof fadeSecs==='number'&&fadeSecs!==IDLE_FADE){IDLE_FADE=fadeSecs;changed=true;}
  return changed;
}

// Single-state invariant. A new cycle can begin while a previous state is
// still showing (success revert pending, an error lingering, an STS turn still
// speaking). enterState clears any pending revert timer (stopTm / errTimer) and
// strips EVERY state class before adding the new one — otherwise stacked
// classes make two panes render at once (a bare overlapped rectangle) and a
// stale revert timer can fire mid-state, stripping the class and mis-sizing the
// window. All four state handlers go through it.
function enterState(cls){
  if(stopTm){clearTimeout(stopTm);stopTm=null;}
  if(errTimer){clearTimeout(errTimer);errTimer=null;}
  var p=document.getElementById('pill');
  // A hotkey can start a cycle while the menu is open; the menu must not
  // survive into a window sized for the new pane.
  // Every state change closes the menu, idle included: a hotkey can start a
  // cycle while it is open, and a settings save can resize at idle — either way
  // a surviving `.show` leaves a menu in a window sized without it.
  var dd=document.getElementById('dropdown');
  if(dd)dd.classList.remove('show');
  p.classList.remove('recording','processing','success','error');
  if(cls)p.classList.add(cls);
  else lastResultKey=null; // idle: no transient result label to re-localize
  expectedState=cls||null;
}
function startRec(){
  if(isRec)return;isRec=true;closeMenu();clearErr();
  applyVisual(()=>{
    enterState('recording');
    document.getElementById('rec-dur').textContent='0s';
    const t0=Date.now();
    if(durTm)clearInterval(durTm);
    durTm=setInterval(()=>{document.getElementById('rec-dur').textContent=Math.round((Date.now()-t0)/1000)+'s';},1000);
    if(animId)cancelAnimationFrame(animId);animT=0;drawW();
  },REC_W,PH).catch(NOOP);
}
function showProcessing(){
  isRec=false;clearErr();
  if(durTm){clearInterval(durTm);durTm=null;}
  if(animId){cancelAnimationFrame(animId);animId=null;}
  applyVisual(()=>{enterState('processing');},PROC_W,PH).catch(NOOP);
}
function stopRec(text){
  isRec=false;clearErr();
  if(durTm){clearInterval(durTm);durTm=null;}
  if(animId){cancelAnimationFrame(animId);animId=null;}
  var key=text?'done':'nospeech';
  lastResultKey=key;
  applyVisual(()=>{
    setIconSvg(document.getElementById('result-icon'),text?CHROME_SVG.check:CHROME_SVG.cross);
    document.getElementById('result-text').textContent=L(key);
    // enterState clears any prior revert timer and every state class (so a
    // lingering 'error'/'success' from the last cycle can't stack with this
    // one), then this cycle arms its OWN 1200ms revert to idle. The timer is
    // armed inside the mutation, after enterState, so enterState's timer
    // sweep can never cancel the revert it belongs to.
    enterState(text?'success':'error');
    stopTm=setTimeout(()=>{
      stopTm=null;
      idleSz().catch(NOOP);
    },1200);
  },resultW(L(key)),PH).catch(NOOP);
}
// ── Empty input ── PillEventSink (adapters.rs) emits `float:empty-input` for
// PipelineEvent::EmptyInput — a text source (e.g. selection) that produced no
// text, NOT "no speech" (nothing was ever listened for). Deliberately its own
// function rather than routing through stopRec(""): that would land on
// stopRec's 'nospeech' key, whose label literally reads "No speech"/
// "未识别到语音" — wrong here. Same red-cross flash visuals (the 'error' CSS
// class — icon/border/text color) and the same ~1.2s idle-return timing as
// stopRec's error branch, just a different, accurate label. The richer
// "select some text and try again" explanation rides on an OS notification
// (tray.rs::notify_empty_input) that this pill state does not depend on —
// permission for it can be silently denied.
function showEmptyInput(){
  isRec=false;clearErr();
  if(durTm){clearInterval(durTm);durTm=null;}
  if(animId){cancelAnimationFrame(animId);animId=null;}
  var key='emptyInput';
  lastResultKey=key;
  applyVisual(()=>{
    setIconSvg(document.getElementById('result-icon'),CHROME_SVG.cross);
    document.getElementById('result-text').textContent=L(key);
    enterState('error');
    stopTm=setTimeout(()=>{
      stopTm=null;
      idleSz().catch(NOOP);
    },1200);
  },resultW(L(key)),PH).catch(NOOP);
}
// ── Bench reset ── Emitted by BenchEventSink (bench.rs) once a Test Run bench
// run reaches a terminal state (Delivered/NoSpeech/Failed). A bench mic run's
// MicSource::acquire drives float:start directly (bypassing BenchEventSink
// entirely, so the pill correctly shows "recording" during bench capture) —
// without this, nothing ever tells the pill to leave that state once the
// bench run finishes. Silent: no result pane, no flash. `float:stop("")` was
// rejected for this (see bench.rs) — stopRec treats an empty payload as "no
// speech" and shows the red-cross result for ~1.2s, which is wrong for a
// successful Delivered bench run. Resets the full recording state (isRec/
// durTm/animId), not just the CSS class, so a bench mic run can't leave stale
// state that would block the NEXT real recording's startRec() (`if(isRec)
// return;`). A no-op (idle→idle, no visible change) when the bench run never
// touched the pill (non-mic recipes/widgets).
function resetPill(){
  isRec=false;
  if(durTm){clearInterval(durTm);durTm=null;}
  if(animId){cancelAnimationFrame(animId);animId=null;}
  clearErr();
  idleSz().catch(NOOP);
}
function clearErr(){
  errActive=false;errPane=null;
  if(errTimer){clearTimeout(errTimer);errTimer=null;}
  if(stopTm){clearTimeout(stopTm);stopTm=null;}
  var t=document.getElementById('result-text');if(t)t.title='';
}
function showError(payload){
  // Pipeline / permission failure. `payload` is either the structured JSON
  // {message, pane} emitted by error_surface::emit_float_error, or a plain
  // string (backward compatible). Show a short label in the narrow pill and
  // keep the full message in console.warn + the title attribute. When a
  // permission `pane` is present, the pill becomes clickable (see onPillClick).
  isRec=false;
  if(durTm){clearInterval(durTm);durTm=null;}
  if(animId){cancelAnimationFrame(animId);animId=null;}
  // Sweep pending reverts NOW (not just in enterState, which may run a tick
  // later on the grow path): a success revert firing inside that gap would
  // supersede this transition and strand errActive without an error pane.
  if(stopTm){clearTimeout(stopTm);stopTm=null;}
  if(errTimer){clearTimeout(errTimer);errTimer=null;}

  var full='',pane=null;
  if(payload){
    try{
      var o=JSON.parse(payload);
      if(o&&typeof o==='object'&&'message'in o){full=o.message||'';pane=o.pane||null;}
      else{full=String(payload);}
    }catch(_){full=String(payload);}
  }
  if(!full)full=L('error');

  // The backend error message is not localized (it's a diagnostic string); only
  // the fallback and the click hint follow the pill language. lastResultKey is
  // cleared so a live locale switch doesn't try to re-localize this dynamic text.
  lastResultKey=null;

  // Truncate to ~48 chars for the pill; append the click hint when clickable.
  var short=full.length>48?full.slice(0,47)+'…':full;
  var disp=pane?short+L('clickSettings'):short;

  console.warn('fonos float error: '+full);
  errActive=true;errPane=pane;

  // Size the pill to the displayed text so it never overflows:
  // ~5px/char at 9px + icon/padding overhead.
  var w=Math.max(110,Math.min(440,Math.round(disp.length*5)+44));

  applyVisual(function(){
    setIconSvg(document.getElementById('result-icon'),CHROME_SVG.cross);
    var textEl=document.getElementById('result-text');
    textEl.textContent=disp;
    textEl.title=full; // full message on hover
    // enterState clears any pending stopRec/error revert (so a prior revert
    // can't cut this error short) and strips every state class before the
    // error pane is shown. The revert is armed after it, inside the same
    // mutation, so the sweep can't cancel this cycle's own timer.
    enterState('error');
    // Permission errors linger longer so they can be read and clicked.
    errTimer=setTimeout(function(){
      clearErr();
      idleSz().catch(NOOP);
    },pane?6000:2600);
  },w,PH).catch(NOOP);
}
function drawW(){
  animId=requestAnimationFrame(drawW);animT+=0.04;
  const c=document.getElementById('rec-wave').getContext('2d');
  c.clearRect(0,0,40,14);c.beginPath();
  for(let i=0;i<=24;i++){const x=(i/24)*40,e=Math.sin((i/24)*Math.PI),y=7+Math.sin((i/24)*Math.PI*4+animT*3)*4*e;if(i===0)c.moveTo(x,y);else c.lineTo(x,y);}
  c.strokeStyle='rgba(251,191,36,0.5)';c.lineWidth=1.5;c.stroke();
}

document.addEventListener('click',e=>{
  if(!e.target.closest('#dropdown')&&!e.target.closest('#pill'))closeMenu();
});
// Close when window loses focus (user clicks anywhere outside the float window)
window.addEventListener('blur',()=>{closeMenu();});

// ── Pointer: wake from dormancy, and tell a click from a drag ──
var pillEl=document.getElementById('pill');
pillEl.addEventListener('pointerdown',onPointerDown);
pillEl.addEventListener('pointermove',onPointerMove);
pillEl.addEventListener('pointerup',onPointerUp);
pillEl.addEventListener('pointercancel',onPointerCancel);
document.addEventListener('mouseenter',()=>armDormancy());

function setup(){
  if(typeof window.__TAURI_INTERNALS__==='undefined'){setTimeout(setup,500);return;}
  const inv=window.__TAURI_INTERNALS__.invoke.bind(window.__TAURI_INTERNALS__);
  const tr=window.__TAURI_INTERNALS__.transformCallback;
  function listen(ev,cb){inv('plugin:event|listen',{event:ev,target:{kind:'Any'},handler:tr(cb)}).catch(()=>{});}
  listen('float:start',()=>startRec());
  listen('float:processing',()=>showProcessing());
  listen('float:stop',e=>stopRec(e&&e.payload?e.payload:''));
  listen('float:empty-input',()=>showEmptyInput());
  listen('float:error',e=>showError(e&&e.payload?e.payload:''));
  listen('float:reset',()=>resetPill());
  // Settings changed (not a pill terminal event): live-update the language,
  // active voice workflow and indicator shape from the subset save_config
  // emits. Rust only shows/hides the window for a shape change
  // (commands::set_float_visible) — the geometry is this side's job, so that
  // it rides applyVisual's protected transition path like every other resize.
  listen('config:saved',e=>{
    var p=e&&e.payload;if(!p)return;
    var wasOff=FORM==='off';
    if(p.active_voice_workflow)currentMode=p.active_voice_workflow;
    applyLocale(p.ui_language);
    if(applyForm(p.float_indicator,p.float_idle_fade_secs)){
      // Re-assert geometry for whatever is on screen. At idle that is the new
      // shape's idle size; mid-state it is the pane's own size — which matters
      // most when leaving "off", where every resize was skipped and the native
      // window is still whatever startup left it, so a 122pt recording pill
      // would otherwise be shown inside a 44pt frame.
      // Geometry for the new shape; syncVisibility (inside applyVisual) then
      // shows or hides to match. The bespoke off→visible handshake that used to
      // live here is gone: visibility is now a plain function of shape AND
      // state, re-evaluated by every transition, so a shape change needs no
      // special case of its own.
      if(expectedState===null)idleSz().catch(NOOP); else reassertGeometry().catch(NOOP);
    }
  });

  // Shape and fade delay before anything paints, so the first frame is already
  // the configured shape rather than the built-in default flashing into it.
  //
  // #container stays `visibility:hidden` until applyForm marks the document
  // form-ready, so EVERY exit from here must reach applyForm — a path that
  // doesn't leaves the indicator permanently invisible with no way to recover
  // from the UI, since its own settings live behind it. Hence the falsy-payload
  // branch and the timeout below: a hung invoke must still end in a visible,
  // default-shaped indicator.
  var geomDone=false;
  function applyGeometry(g){
    if(geomDone)return;
    geomDone=true;
    if(g&&Array.isArray(g.sizes)){
      var m={};
      g.sizes.forEach(function(row){m[row[0]]=[row[1],row[2]];});
      IDLE_SIZES=m;
    }
    if(g&&typeof g.working_height==='number')PH=g.working_height;
    applyForm(g&&g.form,g&&g.idle_fade_secs);
    // Size, then reveal. idleSz() routes the class swap through applyVisual, so
    // the shape lands on the correct side of the initial resize; the window is
    // created hidden and shown here, once it is the right size. Without this
    // the indicator was absent for the whole 1200ms until Rust's safety net
    // fired — that net is for a wedged webview, not the normal path.
    // syncVisibility (inside applyVisual) reveals it once the geometry has
    // landed, and leaves it hidden if that failed — a window shown without
    // #container's form-ready is invisible to the eye but still eats clicks.
    // Rust's 1200ms net covers a total failure.
    idleSz().catch(NOOP);
  }
  inv('float_geometry').then(applyGeometry).catch(function(){applyGeometry(null);});
  setTimeout(function(){applyGeometry(null);},3000);

  loadCfg();loadModes();
}
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',()=>setTimeout(setup,100)):setTimeout(setup,100);
</script>
</body>
</html>
